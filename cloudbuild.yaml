# Cloud Build configuration para desplegar desde GitHub
steps:
  # Build admin_gym image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/admin-gym:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/admin-gym:latest'
      - '-f'
      - 'admin_gym/Dockerfile'
      - './admin_gym'
    id: 'build-admin-gym'

  # Build trainer_app image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/trainer-app:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/trainer-app:latest'
      - '-f'
      - 'trainer_app/Dockerfile'
      - './trainer_app'
    id: 'build-trainer-app'

  # Push admin_gym image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/admin-gym:$COMMIT_SHA'
    id: 'push-admin-gym'
    waitFor: ['build-admin-gym']

  # Push trainer_app image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/trainer-app:$COMMIT_SHA'
    id: 'push-trainer-app'
    waitFor: ['build-trainer-app']

  # Deploy admin_gym to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'admin-gym'
      - '--image'
      - 'gcr.io/$PROJECT_ID/admin-gym:$COMMIT_SHA'
      - '--region'
      - 'southamerica-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,DB_NAME=fitspace,DB_USER=free-trial-first-project'
      - '--set-secrets'
      - 'DB_PASSWORD=DB_PASSWORD:latest,SECRET_KEY=DJANGO_SECRET_KEY_ADMIN:latest'
      - '--add-cloudsql-instances'
      - 'fitspace-478618:southamerica-west1:free-trial-first-project'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
    id: 'deploy-admin-gym'
    waitFor: ['push-admin-gym']

  # Deploy trainer_app to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'trainer-app'
      - '--image'
      - 'gcr.io/$PROJECT_ID/trainer-app:$COMMIT_SHA'
      - '--region'
      - 'southamerica-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,DB_NAME=fitspace,DB_USER=free-trial-first-project'
      - '--set-secrets'
      - 'DB_PASSWORD=DB_PASSWORD:latest,SECRET_KEY=DJANGO_SECRET_KEY_TRAINER:latest'
      - '--add-cloudsql-instances'
      - 'fitspace-478618:southamerica-west1:free-trial-first-project'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
    id: 'deploy-trainer-app'
    waitFor: ['push-trainer-app']

images:
  - 'gcr.io/$PROJECT_ID/admin-gym:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/admin-gym:latest'
  - 'gcr.io/$PROJECT_ID/trainer-app:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/trainer-app:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
