{% extends "alumno/base_alumno.html" %}
{% load static %}

{% block title %}Editar Hábito a Mejorar - Fitspace{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="glass p-4">
                <h4 class="text-white mb-3">Editar Hábito a Mejorar</h4>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-white">Categoría</label>
                        <select class="form-select" name="tipo" required>
                            {% for value, label in tipos_habito %}
                                <option value="{{ value }}" {% if habito.tipo == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Nombre</label>
                        <input type="text" class="form-control" name="nombre" value="{{ habito.nombre }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Descripción (opcional)</label>
                        <textarea class="form-control" name="descripcion" rows="3">{{ habito.descripcion }}</textarea>
                    </div>
                    <div class="d-flex justify-content-end">
                        <a href="{% url 'alumno:habitos_malos' %}" class="btn btn-glass me-2">Cancelar</a>
                        <button class="btn btn-warning" type="submit">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
