{% extends "alumno/base_alumno.html" %}
{% load static %}

{% block title %}Editar Hábito - Fitspace{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="glass p-4">
                <h4 class="text-white mb-3">Editar Hábito</h4>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-white">Tipo</label>
                        <select class="form-select" name="tipo" required>
                            {% for value, label in tipos_habito %}
                                <option value="{{ value }}" {% if habito.tipo == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Nombre</label>
                        <input type="text" class="form-control" name="nombre" value="{{ habito.nombre }}" required>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-8">
                            <label class="form-label text-white">Meta Diaria</label>
                            <input type="number" class="form-control" name="meta_diaria" min="1" value="{{ habito.meta_diaria }}" required>
                        </div>
                        <div class="col-4">
                            <label class="form-label text-white">Unidad</label>
                            <input type="text" class="form-control" name="unidad" value="{{ habito.unidad }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Descripción</label>
                        <textarea class="form-control" name="descripcion" rows="3">{{ habito.descripcion }}</textarea>
                    </div>
                    <div class="d-flex justify-content-end">
                        <a href="{% url 'alumno:habitos_buenos' %}" class="btn btn-glass me-2">Cancelar</a>
                        <button class="btn btn-success" type="submit">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
